apiVersion: v1               # core API group
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP            # internal-only virtual IP (default). We'll reach it
                             # from the host with `kubectl port-forward` for now.
  selector:
    app: backend            # route traffic to Pods labeled app: backend
  ports:
    - port: 8000            # the port the Service exposes
      targetPort: 8000      # the port on the Pod/container to forward to
