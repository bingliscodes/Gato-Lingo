# Redis as a STATELESS workload: no PVC, because the only data here is
# rate-limit counters (date-keyed, TTL'd, disposable). Contrast with
# postgres.yaml, which needed a PersistentVolumeClaim.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine     # same image as docker-compose
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis            # matches REDIS_URL "redis://redis:6379/0" in the ConfigMap
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
