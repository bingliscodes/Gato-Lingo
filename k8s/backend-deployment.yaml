apiVersion: apps/v1 # Deployments live in the apps/v1 API group
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1 # desired state: keep exactly 1 Pod running
  selector:
    matchLabels:
      app: backend # this Deployment owns Pods with this label...
  template: # ...and stamps that label onto the Pods it creates
    metadata:
      labels:
        app: backend # MUST match selector.matchLabels above
    spec:
      containers:
        - name: backend
          image: gato-lingo-backend:dev
          # Use the locally-built image instead of pulling from a registry.
          # (We never pushed it anywhere, so a pull would fail.)
          imagePullPolicy: IfNotPresent
          # Inject all keys from the ConfigMap and the backend Secret (JWT_SECRET).
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          env:
            # DB password from the SAME Secret that Postgres uses (single source
            # of truth). secretKeyRef pulls ONE key: `password` -> POSTGRES_PASSWORD.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-password
                  key: password
          ports:
            - containerPort: 8000
