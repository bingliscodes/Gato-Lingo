# TEMPLATE for k8s/secrets.yaml (which is gitignored — real values never get committed).
# Setup on a new machine:
#   cp k8s/secrets.example.yaml k8s/secrets.yaml
#   # edit k8s/secrets.yaml, replace the CHANGE_ME values
#   kubectl apply -f k8s/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: postgres-password      # Postgres superuser password (consumed by db + backend)
type: Opaque
stringData:
  password: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME"      # signing key for JWT auth
